name: Publish to Hex

# Publishing a GitHub release (tag `v<version>`) publishes that version to Hex,
# docs included. Needs the `HEX_API_KEY` repository secret
# (`mix hex.user key generate --key-name github-actions --permission api:write`).
# Run it manually (Actions → Publish to Hex → Run workflow) for a dry run: same
# checks plus `mix hex.build`, nothing is uploaded.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hex-publish
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ github.event_name == 'release' && format('Publish {0}', github.event.release.tag_name) || 'Dry run' }}
    runs-on: ubuntu-22.04
    environment: hex
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.0"

      - name: Tag, mix.exs and CHANGELOG agree on the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          echo "tag=$TAG mix.exs=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match mix.exs version v$version"
            exit 1
          fi
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version"
            exit 1
          fi

      - name: Install dependencies
        run: mix deps.get

      - name: Quality gates
        run: |
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix test

      - name: Build package (dry run)
        if: github.event_name != 'release'
        run: mix hex.build && mix docs

      - name: Publish package and docs
        if: github.event_name == 'release'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
